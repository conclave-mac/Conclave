# Un DMG per architettura, Apple Silicon e Intel (Node è il 95% dell'app: un DMG universale
# pesava il doppio).
# - Push su main: controlli + DMG come artifact (ogni commit ha la sua build di prova).
# - Tag v* (es. v0.1.0): in più crea la GitHub Release con il DMG e i checksum.
# - Avvio manuale (Actions ▸ Release ▸ Run workflow): come un push.
name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["**.md", "docs/**"]
  workflow_dispatch:

# Un push nuovo annulla la build superata dello stesso ramo (le release non si annullano).
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

permissions:
  contents: write

jobs:
  dmg:
    runs-on: macos-26
    # I fork non usano i runner macOS per questo workflow.
    if: github.repository_owner == 'peppolone'
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Strumenti
        run: |
          xcodebuild -version
          node -v

      - name: Controlli del motore
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run test:chaos

      - name: Versione
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then V="${GITHUB_REF_NAME#v}"; else V="$(node -p 'require("./package.json").version')"; fi
          echo "VERSION=$V" >> "$GITHUB_ENV"
          echo "Versione: $V"

      - name: Compilazione e DMG (Apple Silicon, Intel)
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          SIGNING_P12_PASSWORD: ${{ secrets.SIGNING_P12_PASSWORD }}
          SIGNING_P12_BASE64: ${{ secrets.SIGNING_P12_BASE64 }}
        run: |
          mkdir -p out
          # Certificato autofirmato del progetto: stessa identità a ogni versione (Portachiavi).
          export SIGNING_P12="$RUNNER_TEMP/signing.p12"
          printf '%s' "$SIGNING_P12_BASE64" | base64 -D > "$SIGNING_P12"
          for a in arm64 x86_64; do
            scripts/fetch-node.sh "$a" "$RUNNER_TEMP/node/node-$a"
            ARCHS="$a" NODE_BIN="$RUNNER_TEMP/node/node-$a" OUT_DIR="dist/$a" zsh scripts/build-app.sh
          done
          scripts/make-dmg.sh dist/arm64/Conclave.app "out/Conclave-$VERSION-apple-silicon.dmg"
          scripts/make-dmg.sh dist/x86_64/Conclave.app "out/Conclave-$VERSION-intel.dmg"
          (cd out && shasum -a 256 *.dmg > SHA256SUMS.txt && cat SHA256SUMS.txt)
          ls -l out

      - name: Prova dei DMG (architetture, firma, avvio del motore; x86_64 con Rosetta)
        run: |
          engine() {  # $1 = app, $2 = architettura; il motore deve scrivere la sua porta
            local DATA="$(mktemp -d)"
            COUNCIL_DATA="$DATA" PORT=0 arch "-$2" "$1/Contents/MacOS/node" --disable-warning=ExperimentalWarning \
              "$1/Contents/Resources/server/src/server.ts" > "$DATA/out.log" 2>&1 &
            local PID=$!
            for i in {1..30}; do grep -q COUNCIL_PORT "$DATA/out.log" && break; sleep 1; done
            kill $PID 2>/dev/null || true
            grep -q COUNCIL_PORT "$DATA/out.log" && echo "  motore $2: OK ($(arch -$2 "$1/Contents/MacOS/node" -v))" \
              || { echo "  motore $2: FALLITO"; cat "$DATA/out.log"; return 1; }
          }
          check() {  # $1 = DMG, $2 = architetture attese (in ordine alfabetico)
            echo "$1"
            local MNT="$(mktemp -d)"
            hdiutil attach -nobrowse -readonly -mountpoint "$MNT" "out/$1" >/dev/null
            local APP="$MNT/Conclave.app"
            for b in Conclave node; do
              local got="$(lipo -archs "$APP/Contents/MacOS/$b" | tr ' ' '\n' | sort | xargs)"
              [[ "$got" == "$2" ]] || { echo "  $b: architetture '$got', attese '$2'"; return 1; }
            done
            echo "  architetture: $2"
            codesign --verify --deep --strict "$APP" || { echo "  firma: NON valida"; return 1; }
            echo "  firma: OK"
            for a in $2; do
              if [[ $a == x86_64 ]] && ! arch -x86_64 /usr/bin/true 2>/dev/null; then echo "  Rosetta assente: x86_64 non provato"
              else engine "$APP" "$a" || return 1; fi
            done
            hdiutil detach "$MNT" >/dev/null
          }
          check "Conclave-$VERSION-apple-silicon.dmg" "arm64"
          check "Conclave-$VERSION-intel.dmg" "x86_64"

      # archive: false → si scarica direttamente il .dmg, senza zip (un solo file per caricamento).
      - uses: actions/upload-artifact@v7
        with:
          path: out/Conclave-${{ env.VERSION }}-apple-silicon.dmg
          archive: false
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          path: out/Conclave-${{ env.VERSION }}-intel.dmg
          archive: false
          if-no-files-found: error

      - name: GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Note dalla sezione del CHANGELOG di questa versione (le legge anche l'avviso di aggiornamento
          # dell'app); --generate-notes senza PR dava solo la riga "Full Changelog".
          awk -v v="$VERSION" '/^## \[/ { p = index($0, "## [" v "]") == 1; next } p' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md"; then notes=(--notes-file "$RUNNER_TEMP/notes.md"); else notes=(--generate-notes); fi
          gh release create "$GITHUB_REF_NAME" out/* --title "Conclave $VERSION" "${notes[@]}" --verify-tag
