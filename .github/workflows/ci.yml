# Controlli su pull request e push su main (i DMG si costruiscono solo per le release, in release.yml).
name: CI

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**"]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Strumenti
        run: |
          xcodebuild -version
          node -v

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Prove Swift
        run: tests/swift/run.sh
      - run: npm run test:chaos

      - name: Compilazione dell'app
        # Le PR non hanno i secrets del certificato: firma ad-hoc dichiarata.
        env:
          ALLOW_ADHOC: "1"
        run: |
          npm run app
          codesign --verify --deep --strict dist/Conclave.app

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # CLI ufficiale invece di gitleaks-action: l'azione chiede una licenza ai repo delle organizzazioni.
      - name: gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          f=gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz
          curl -fsSL -o "$f" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$f"
          echo "${GITLEAKS_SHA256}  $f" | sha256sum -c -
          tar -xzf "$f" gitleaks
          ./gitleaks git --redact --no-banner -v .
